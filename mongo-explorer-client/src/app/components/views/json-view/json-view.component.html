@let items = entries();

@if (items.length === 0) {
    <div class="state-block">
        <i class="pi pi-inbox state-icon"></i>
        <div>No documents to display.</div>
    </div>
} @else {
    <div class="json-list">
        @for (entry of items; track entry.key; let index = $index) {
            <div class="json-entry" [class.selected]="isSelected(entry)" (click)="select(entry)">
                <div class="entry-header">
                    <span class="entry-index tiny subtle">#{{ index + 1 }}</span>
                    <span class="entry-actions">
                        <button type="button" class="cell-action" title="Copy as Extended JSON" (click)="copy(entry, $event)">
                            <i class="pi pi-copy"></i>
                        </button>
                        <button type="button" class="cell-action" title="Edit this document" (click)="edit(index, $event)">
                            <i class="pi pi-pencil"></i>
                        </button>
                    </span>
                </div>
                <pre class="entry-body scroll-x">{{ entry.json }}</pre>
            </div>
        }
    </div>
}
